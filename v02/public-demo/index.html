<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>thdmn 公開サンプル</title><link rel="stylesheet" href="/demo.css"><body><header><a class="brand" href="/">thdmn</a><span class="pill">公開専用の架空サンプル</span><a class="login" href="https://thdmn-aklius14pg-8355s-projects.vercel.app/">保存・共有を使う（Googleログイン）</a></header><main><section class="hero"><div><p class="eyebrow">まずは、ログインなしで。</p><h1>Taskのつながりを、<br>小さなカフェで試そう。</h1><p>メニューを完了すると、開店チェックとプロジェクトの表示が変わります。コピーを作れば、名前や状態を自由に編集できます。</p><div class="actions"><button id="demo-start">コピーで体験する</button><button id="demo-reset" hidden>このタブのコピーだけ初期化</button></div></div><aside><strong id="demo-progress"></strong><p id="demo-status" role="status"></p><p>体験コピーはこのブラウザのタブ内だけに保存します。ほかの人や保存用サーバーには送信しません。</p><p>保存・共有には既存のGoogleログインを使います。ログインしても、この体験コピーは送信されません。</p></aside></section><p id="demo-error" role="alert"></p><section id="demo" class="demo-grid" aria-label="公開サンプルのTask"></section><form id="demo-add" class="add-panel" hidden><h2>体験コピーに子Taskを追加</h2><label>親Task<select id="demo-parent"></select></label><label>新しい名前<input id="demo-new-name" maxlength="160" required></label><button type="submit">このコピーに追加</button></form><footer>このページは公開専用の架空データです。試験用DBや実際のTaskは表示していません。</footer></main><script type="module" src="/demo.js"></script></body></html>
