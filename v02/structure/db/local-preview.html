<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>thdmn 独立SQL DB検証</title>
<style>body{font:16px system-ui;background:#111821;color:#e4eaf3;margin:0;padding:20px}button{font:inherit;padding:8px 12px;margin:4px;border:1px solid #50677b;border-radius:6px;background:#203044;color:inherit;max-width:100%;overflow-wrap:anywhere;text-align:left}nav{display:flex;gap:6px;flex-wrap:wrap}.entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:12px}article{padding:16px;border:1px solid #50677b;border-radius:8px;min-width:0}article span{display:block;font-size:12px;color:#a5c2d7}article button{display:block}h1{font-size:23px}h2{font-size:20px;overflow-wrap:anywhere}p{overflow-wrap:anywhere}[data-state=done]{border-color:#60a886;background:#193b30}[data-state=hold]{border-color:#b78648;background:#3d3020}form{border-top:1px solid #50677b;margin-top:20px;padding-top:12px}form label{display:block;margin:10px 0}select{display:block;font:inherit;max-width:100%;padding:8px;background:#203044;color:inherit}p[role=alert]{color:#ffbc99}</style>
<h1>独立ローカルDB・構造検証</h1><p>合成9タスク / ローカルPostgres SQL / 合成認証。実DB・Googleログインには接続しません。参照追加・削除は無効。前提Tierはこの合成検証だけ10固定です。</p><main id="structure"></main><script type="module">
import{mountStructureBrowser}from'./browser.mjs';
const transport=async(path,options={})=>{if(!options.method||options.method==='GET')return fetch(path+'?workspace=fixture',options);const body=JSON.parse(options.body),type=path.endsWith('/dependencies/remove')?'removeDependency':path.endsWith('/references/remove')?'removeReference':'addDependency';const command=type==='addDependency'?{type,edge:body.edge,tier:'10'}:type==='removeDependency'?{type,dependencyId:body.dependencyId}:{type,referenceId:body.referenceId};return fetch('/api/v02/structure/commands',{...options,body:JSON.stringify({workspaceId:'fixture',operationId:body.operationId,expectedRevision:body.expectedRevision,command})});};
await mountStructureBrowser(document.getElementById('structure'),{fetchImpl:transport,storageLabel:'独立ローカルSQL DB'});document.querySelector('[role=status]').insertAdjacentText('afterend','（保存先：独立ローカルSQL DB。担当ユーザーは合成editor）');
</script></html>
