<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>thdmn</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/simple.css"><link rel="stylesheet" href="/menu-pane.css"><link rel="stylesheet" href="/site-layout.css"><link rel="stylesheet" href="/top.css"><link rel="stylesheet" href="/top-v01.css"><body>
<header><a class="brand" href="/top.html">thdmn</a><span id="top-local-notice" class="local-notice" hidden></span><div class="header-account"><button id="top-login" disabled>ログイン</button><button id="top-signup" class="primary" disabled>新規登録</button><button id="top-logout" hidden>ログアウト</button></div></header>
<p id="top-status" class="page-status" role="status" aria-live="polite"></p>
<main><section id="top-home"><a class="sample-entry" href="/demo.html">サンプル画面を開く <span aria-hidden="true">→</span></a></section><section id="top-account" hidden><div id="top-account-content"></div></section></main>
<dialog id="top-auth-dialog" aria-labelledby="top-auth-title"><div class="overlay-heading"><h2 id="top-auth-title">ログイン</h2><button id="top-auth-close" aria-label="閉じる" autofocus>×</button></div><div class="auth-tabs" role="tablist" aria-label="認証方法"><button id="top-tab-login" role="tab" aria-selected="true" aria-controls="top-auth-panel">ログイン</button><button id="top-tab-signup" role="tab" aria-selected="false" aria-controls="top-auth-panel">新規登録</button></div>
<div id="top-auth-panel" role="tabpanel" aria-labelledby="top-tab-login"><p class="mock-warning">UIモックです。実在のID・パスワードは入力しないでください。</p><form id="top-auth-form" method="post" novalidate><label for="top-auth-id">AccountID</label><input id="top-auth-id" name="username" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="21" required aria-describedby="top-id-help"><small id="top-id-help">英字で開始、英数字・_・- の4〜20文字。大文字は小文字として扱います。</small><label for="top-auth-password">パスワード</label><input id="top-auth-password" name="password" type="password" autocomplete="off" minlength="8" maxlength="128" required><small>8文字以上</small><div id="top-confirm-row" hidden><label for="top-auth-confirm">パスワード（確認）</label><input id="top-auth-confirm" type="password" autocomplete="off" maxlength="128"></div><p id="top-no-recovery" class="recovery-note" hidden>メールアドレスは登録しません。パスワードを忘れた場合の復旧はできません。</p><p id="top-auth-error" role="alert" aria-live="polite"></p><button id="top-auth-submit" type="submit" class="auth-primary">ログイン</button></form><div class="auth-divider">または</div><button id="top-auth-google" type="button" class="google-alternative">Googleでログイン</button><p class="google-note">Googleのみでも利用できます。ID・パスワードの作成は不要です。</p></div></dialog><script type="module" src="/top.js"></script></body></html>
