<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thddun</title>
<style>
  :root { --bg: #f7f7f5; --fg: #1c1d1f; --muted: #606368; --line: #d9dadc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121820; --fg: #e6e8eb; --muted: #9aa1aa; --line: #2a333f; }
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    line-height: 1.7; padding: 0 16px; box-sizing: border-box;
  }
  main { max-width: 32rem; }
  h1 { font-size: 1.6rem; margin: 0 0 0.5rem; letter-spacing: 0.02em; }
  p { margin: 0.4rem 0; color: var(--muted); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 1.2rem 0; }
</style>
</head>
<body>
<main>
  <h1>thddun</h1>
  <p>作り直し中です。</p>
  <hr>
  <p>以前の試作版の公開は終了しました。</p>
</main>
</body>
</html>
