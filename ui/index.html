<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thddun</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Workspace と Topic の一覧">
    <header class="side-head">
      <span class="logo">thddun</span>
    </header>
    <nav class="workspaces" id="workspaces"></nav>
    <div class="tree-head">
      <input type="search" id="filter" placeholder="Topic を絞り込む" autocomplete="off">
    </div>
    <nav class="tree" id="tree"></nav>
  </aside>

  <main class="board-area">
    <header class="board-head">
      <nav class="crumbs" id="crumbs" aria-label="今いる場所"></nav>
      <button type="button" class="warn-toggle" id="warn-toggle" hidden></button>
    </header>
    <section class="warnings" id="warnings" hidden></section>
    <section class="board" id="board" aria-label="子の Topic"></section>
  </main>

  <aside class="detail" id="detail" aria-label="Topic の詳細"></aside>
</div>
</body>
</html>
