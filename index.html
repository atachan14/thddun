<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>thdmn</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/simple.css"><link rel="stylesheet" href="/menu-pane.css"><link rel="stylesheet" href="/site-layout.css"><body>
<header><h1>thdmn</h1><a href="/demo.html">ログインせず体験</a><div id="breadcrumbs" aria-label="現在の階層"></div></header><div class="site-toolbar" role="toolbar" aria-label="表示"><button id="menu-toggle" aria-label="メニュー">☰</button><div class="toolbar-modes"><button id="diagram-mode">関係図</button><button id="dashboard-mode">Dashboard</button></div><button id="detail-toggle" aria-label="詳細">◧</button></div>
<div class="site-shell"><aside class="site-sidebar" id="sidebar"><button id="favorite"></button><div id="favorites"></div></aside>
<main><div class="workspace-layout"><div class="center-pane"><div id="board"></div><section class="relations"><h2>前提 <button id="close-connections" aria-label="接続詳細を閉じる">×</button></h2><div id="edges"></div></section></div><aside id="task-detail" aria-label="選択Task"></aside></div></main></div><div id="notice" role="status"></div>
